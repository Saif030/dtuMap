<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>DTU Map — campus map & search</title>
<meta name="description" content="A map of Delhi Technological University with the things students actually look for — departments, hostels, canteens, water, ATMs — fast search, routing, and admin editing.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0d10'/><path d='M8 22 L16 9 L24 22' stroke='%2361d47c' stroke-width='2.5' fill='none' stroke-linejoin='round'/><circle cx='16' cy='23' r='2' fill='%23ffb454'/></svg>">
<script>
  // Dark unless this browser has been told otherwise. Runs before first paint
  // so a light-mode visitor never sees a dark flash.
  try {
    var t = localStorage.getItem('campusmap.theme')
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
    if (t === 'light') {
      document.querySelector('meta[name="theme-color"]').content = '#e9ebef'
    }
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark')
  }
</script>
</head>
<body>
  <div id="map" aria-label="Campus map"></div>

  <header id="bar">
    <button id="brand-btn" type="button" title="About &amp; data sources">dtu<span>map</span></button>
    <button id="open-search" type="button" aria-label="Search campus">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M10.5 10.5 L14.2 14.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span class="ph">Search places, hostels, canteens…</span>
      <kbd>⌘K</kbd>
    </button>
    <button id="admin-btn" type="button" title="Admin mode — add places, draw paths" aria-label="Admin mode">✎</button>
    <button id="layers-btn" type="button" aria-expanded="false" aria-controls="layers">
      <span class="dots" aria-hidden="true"></span>
      <span class="n"></span>
    </button>
    <a id="pixels-btn" href="/pixels/" title="Paint pixel art over campus" aria-label="Pixels">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" shape-rendering="crispEdges">
        <rect x="5"  y="2" width="10" height="2" fill="#ec1f80"/>
        <rect x="3"  y="4" width="14" height="2" fill="#ec1f80"/>
        <rect x="3"  y="6" width="2"  height="6" fill="#ec1f80"/>
        <rect x="15" y="6" width="2"  height="6" fill="#ec1f80"/>
        <rect x="5"  y="6" width="10" height="6" fill="#fffabc"/>
        <rect x="6"  y="8" width="2"  height="2" fill="#28509e"/>
        <rect x="12" y="8" width="2"  height="2" fill="#28509e"/>
        <rect x="9"  y="11" width="2" height="1" fill="#cb007a"/>
        <rect x="5"  y="12" width="10" height="2" fill="#ec1f80"/>
        <rect x="6"  y="14" width="8"  height="4" fill="#ffffff"/>
        <rect x="4"  y="16" width="2"  height="2" fill="#13e67b"/>
        <rect x="14" y="16" width="2"  height="2" fill="#4093e4"/>
      </svg>
    </a>
    <button id="theme-btn" type="button" aria-label="Change theme" title="Theme"></button>
  </header>

  <!-- One stack, so the chips can wrap to any number of rows without ever
       colliding with the footer below them. -->
  <div id="dock">
    <nav id="layers" aria-label="Map layers">
      <div class="layers-head">
        <span class="t">Layers</span>
        <button type="button" data-all>All</button>
        <button type="button" data-none>None</button>
        <button type="button" class="layers-close" aria-label="Close layers">&times;</button>
      </div>
      <div id="layer-chips"></div>
    </nav>
    <footer id="foot">
      <span class="by">DTU campus map · © OpenStreetMap contributors</span>
    </footer>
  </div>

  <div id="attrib">
    <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
  </div>

  <section id="panel" hidden aria-live="polite"></section>

  <div id="palette" hidden role="dialog" aria-modal="true" aria-label="Search campus">
    <div id="palette-box">
      <div id="palette-input-row">
        <span id="palette-glyph" aria-hidden="true">›</span>
        <input id="palette-input" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" enterkeyhint="go"
                placeholder="hostel · library · canteen · atm · gate …"
               aria-label="Search campus" aria-controls="palette-results" aria-expanded="true">
        <span id="palette-timing" aria-hidden="true"></span>
        <button id="palette-close" type="button" aria-label="Close search">&times;</button>
      </div>
      <div id="palette-results" role="listbox"></div>
      <footer id="palette-foot">
        <span class="hint"><kbd>↑↓</kbd> move</span>
        <span class="hint"><kbd>↵</kbd> open</span>
        <span class="hint"><kbd>tab</kbd> route</span>
        <a id="palette-repo" href="https://www.openstreetmap.org/#map=16/28.75/77.1165" target="_blank" rel="noopener">improve OSM</a>
        <span id="palette-count"></span>
      </footer>
    </div>
  </div>

  <div id="boot">loading campus…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
